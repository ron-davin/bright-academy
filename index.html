    <script>
      // GitHub Pages SPA redirect (pairs with public/404.html)
      (function () {
        var q = window.location.search;
        if (q && q.indexOf('?/') === 0) {
          var path = q.slice(2).replace(/~and~/g, '&');
          window.history.replaceState(null, null, window.location.pathname.replace(/\/$/, '') + '/' + path.replace(/^\//, '') + window.location.hash);
        }
      })();
